name: Create release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (example: "1.1.0")'
        required: true
        default: ''
env:
  VERSION: ${{ github.event.inputs.version }}
  PUBLISH_WIN_PATH: ./MkvDefaultTrackChanger/MkvDefaultTrackChanger.WinForms/bin/Release/net10.0-windows/win-x64/publish
  PUBLISH_LINUX_PATH: ./MkvDefaultTrackChanger/MkvDefaultTrackChanger.Gtk/bin/Release/net10.0/linux-x64/publish
  PUBLISH_MAC_PATH: ./MkvDefaultTrackChanger/MkvDefaultTrackChanger.Mac/bin/Release/net10.0/osx-x64/publish
  WIN_EXE: MkvDefaultTrackChanger-V${{ github.event.inputs.version }}.exe
  LINUX_BIN: MkvDefaultTrackChanger-V${{ github.event.inputs.version }}.Gtk
  MAC_APP: MkvDefaultTrackChanger-V${{ github.event.inputs.version }}.Mac.app
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - name: Validate version input
      run: echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build Windows
      run: dotnet publish MkvDefaultTrackChanger/MkvDefaultTrackChanger.WinForms/MkvDefaultTrackChanger.WinForms.csproj -c Release -r win-x64 -p:PublishSingleFile=true -p:EnableWindowsTargeting=true
    - name: Build Linux
      run: dotnet publish MkvDefaultTrackChanger/MkvDefaultTrackChanger.Gtk/MkvDefaultTrackChanger.Gtk.csproj -c Release -r linux-x64 -p:PublishSingleFile=true
    - name: Build Mac
      run: dotnet publish MkvDefaultTrackChanger/MkvDefaultTrackChanger.Mac/MkvDefaultTrackChanger.Mac.csproj -c Release -r osx-x64 -p:PublishSingleFile=true
    - name: Zip releases
      run: |
        mv $PUBLISH_WIN_PATH/MkvDefaultTrackChanger.WinForms.exe $PUBLISH_WIN_PATH/$WIN_EXE
        zip -j -9 ./MkvDefaultTrackChanger-Windows-V$VERSION.zip $PUBLISH_WIN_PATH/$WIN_EXE

        mv $PUBLISH_LINUX_PATH/MkvDefaultTrackChanger.Gtk $PUBLISH_LINUX_PATH/$LINUX_BIN
        chmod +x $PUBLISH_LINUX_PATH/$LINUX_BIN
        zip -j -9 ./MkvDefaultTrackChanger-Linux-V$VERSION.zip $PUBLISH_LINUX_PATH/$LINUX_BIN

        mv $PUBLISH_MAC_PATH/MkvDefaultTrackChanger.Mac.app $PUBLISH_MAC_PATH/$MAC_APP
        chmod +x $PUBLISH_MAC_PATH/$MAC_APP/Contents/MacOS/MkvDefaultTrackChanger.Mac
        # zip from inside the publish dir so the .app bundle sits at the root of the archive
        cd $PUBLISH_MAC_PATH && zip -r -9 --symlinks $GITHUB_WORKSPACE/MkvDefaultTrackChanger-MacOS-V$VERSION.zip $MAC_APP
    - name: Create Draft Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: V${{ github.event.inputs.version }}
        name: v${{ github.event.inputs.version }}
        body: TODO add description
        draft: true
        prerelease: false
        generate_release_notes: true
        fail_on_unmatched_files: true
        files: |
          ./MkvDefaultTrackChanger-Windows-V${{ github.event.inputs.version }}.zip
          ./MkvDefaultTrackChanger-Linux-V${{ github.event.inputs.version }}.zip
          ./MkvDefaultTrackChanger-MacOS-V${{ github.event.inputs.version }}.zip
